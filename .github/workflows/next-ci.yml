name: next-ci

# Quality gate for next/ and root-app smoke tests. It never writes to a Supabase database.
on:
  push:
    paths:
      - "next/**"
      - "app.js"
      - "tmdbService.js"
      - "ui.css"
      - "tests/tmdb-service.test.cjs"
      - "supabase/**"
      - ".github/workflows/next-ci.yml"
  pull_request:
    paths:
      - "next/**"
      - "app.js"
      - "tmdbService.js"
      - "ui.css"
      - "tests/tmdb-service.test.cjs"
      - "supabase/**"
      - ".github/workflows/next-ci.yml"

permissions:
  contents: read

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: Install (exact, from the lockfile)
        run: npm ci

      - name: Check legacy app JavaScript syntax
        run: node --check ../app.js && node --check ../tmdbService.js

      - name: Test legacy TMDB service
        run: node --test ../tests/tmdb-service.test.cjs

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Guard - no server credentials in the browser bundle, and size budgets
        run: npm run check:bundle

      - name: Guard - vercel.json security headers match security/policy.mjs
        run: npm run check:headers

  # Real Chromium against the production build, with a fake Supabase server: offline reload through
  # the service worker, saved-library banner, expired token offline, revoked session, account switch,
  # app update, Cache Storage contents. No real database or key is involved.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: Install (exact, from the lockfile)
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end checks (production headers, zero CSP violations)
        run: npm run e2e

      - name: Accessibility checks (axe, every screen, zero CSP violations)
        run: npm run a11y
